<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Academic Expression Variants</title>
  <desc id="desc">A banner for a Codex skill that generates bilingual academic writing variants.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.48" stop-color="#164e63"/>
      <stop offset="1" stop-color="#365314"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.48" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="0" fill="url(#bg)"/>
  <path d="M0 330 C160 270 270 390 430 330 C590 270 690 330 820 300 C960 268 1050 190 1200 230 L1200 420 L0 420 Z" fill="#f8fafc" opacity="0.08"/>
  <path d="M0 82 C150 32 290 110 420 72 C580 25 700 62 840 47 C1000 30 1100 80 1200 56" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.18"/>

  <g filter="url(#shadow)">
    <rect x="76" y="72" width="1048" height="276" rx="8" fill="#f8fafc" opacity="0.97"/>
    <rect x="76" y="72" width="1048" height="8" rx="4" fill="url(#accent)"/>
  </g>

  <text x="116" y="142" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f766e" letter-spacing="0">
    Codex Skill
  </text>
  <text x="116" y="202" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="#0f172a" letter-spacing="0">
    Academic Expression Variants
  </text>
  <text x="118" y="248" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" fill="#334155" letter-spacing="0">
    Bilingual research prose variants with claim-safe judging
  </text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="0">
    <rect x="116" y="282" width="112" height="40" rx="8" fill="#e0f2fe"/>
    <text x="140" y="308" fill="#075985">Faithful</text>

    <rect x="244" y="282" width="172" height="40" rx="8" fill="#ecfccb"/>
    <text x="267" y="308" fill="#3f6212">Native Academic</text>

    <rect x="432" y="282" width="104" height="40" rx="8" fill="#fef3c7"/>
    <text x="454" y="308" fill="#92400e">Concise</text>

    <rect x="552" y="282" width="136" height="40" rx="8" fill="#fee2e2"/>
    <text x="574" y="308" fill="#991b1b">Strong Claim</text>

    <rect x="704" y="282" width="160" height="40" rx="8" fill="#ede9fe"/>
    <text x="727" y="308" fill="#5b21b6">Reviewer-Safe</text>
  </g>

  <g transform="translate(910 128)">
