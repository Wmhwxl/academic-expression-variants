    <rect x="18" y="22" width="118" height="18" rx="4" fill="#38bdf8"/>
    <rect x="18" y="54" width="76" height="14" rx="4" fill="#f59e0b"/>
    <rect x="18" y="82" width="104" height="14" rx="4" fill="#84cc16"/>
    <path d="M36 124 L72 98 L92 116 L120 82" fill="none" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
