<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Academic Expression Variants Workflow</title>
  <desc id="desc">Workflow diagram showing source text, bilingual variant generation, no-API candidate judging, API mode, and final fused output.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="600" y="60" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="0">
    From Source Text To Claim-Safe Bilingual Prose
  </text>
  <text x="600" y="96" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" fill="#475569" letter-spacing="0">
    Generate variants, judge wording, preserve terminology, and ship a final paper-ready version.
  </text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#shadow)">
    <rect x="70" y="168" width="190" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="165" y="208" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Source Text</text>
    <text x="165" y="238" text-anchor="middle" font-size="15" fill="#475569">Chinese or English</text>
    <text x="165" y="262" text-anchor="middle" font-size="15" fill="#475569">research passage</text>

    <rect x="330" y="150" width="230" height="154" rx="8" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="445" y="188" text-anchor="middle" font-size="20" font-weight="800" fill="#155e75">Skill Pipeline</text>
    <text x="445" y="220" text-anchor="middle" font-size="15" fill="#164e63">Terminology lock</text>
    <text x="445" y="244" text-anchor="middle" font-size="15" fill="#164e63">Meaning diagnosis</text>
    <text x="445" y="268" text-anchor="middle" font-size="15" fill="#164e63">Five version generation</text>

    <rect x="640" y="132" width="220" height="118" rx="8" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="750" y="170" text-anchor="middle" font-size="20" font-weight="800" fill="#92400e">No-API Mode</text>
    <text x="750" y="200" text-anchor="middle" font-size="15" fill="#78350f">ChatGPT model candidates</text>
    <text x="750" y="224" text-anchor="middle" font-size="15" fill="#78350f">manual paste-back judging</text>

    <rect x="640" y="304" width="220" height="118" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="750" y="342" text-anchor="middle" font-size="20" font-weight="800" fill="#166534">API Mode</text>
    <text x="750" y="372" text-anchor="middle" font-size="15" fill="#14532d">OpenAI-compatible endpoints</text>
    <text x="750" y="396" text-anchor="middle" font-size="15" fill="#14532d">DeepSeek, custom, local</text>

    <rect x="940" y="202" width="190" height="154" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1035" y="240" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Final Output</text>
    <text x="1035" y="272" text-anchor="middle" font-size="15" fill="#475569">Ranked candidates</text>
    <text x="1035" y="296" text-anchor="middle" font-size="15" fill="#475569">Final fused version</text>
    <text x="1035" y="320" text-anchor="middle" font-size="15" fill="#475569">English + Chinese</text>
  </g>

  <g fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)">
    <path d="M260 227 L320 227"/>
    <path d="M560 206 C590 194 608 188 630 184"/>
    <path d="M560 254 C590 300 608 340 630 360"/>
    <path d="M860 190 C900 206 920 230 932 254"/>
    <path d="M860 368 C900 348 920 318 932 298"/>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">
    <text x="600" y="494" text-anchor="middle">
      Judging rubric: fidelity, terminology, academic naturalness, bilingual alignment, claim control, and section fit.
    </text>
    <text x="600" y="522" text-anchor="middle">
      Hard boundary: no invented results, citations, datasets, mechanisms, or causal claims.
    </text>
  </g>
</svg>
